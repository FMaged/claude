# The site inside the image. compose mounts the host's config.json at /etc/orders-web/config.json.
server {
    listen 8080;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # Names with a content hash never change.
    location ~ "-[A-Z0-9]{8}\.(?:js|css|woff2?|ttf|svg|png|jpe?g|gif|webp|avif)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # A missing script is a 404, not the app.
    location ~ \.(?:js|css|map)$ {
        try_files $uri =404;
    }

    location = /config.json {
        alias /etc/orders-web/config.json;
        add_header Cache-Control "no-cache";
    }
}
