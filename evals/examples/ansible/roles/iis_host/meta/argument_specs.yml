---
argument_specs:
  main:
    short_description: Prepare a Windows host for ASP.NET Core sites deployed with Web Deploy.
    options:
      iis_host_features:
        type: list
        elements: str
        description: Windows features to install. Web-Mgmt-Service is what Web Deploy listens through.
      iis_host_installer_dir:
        type: str
        description: Folder on the host that keeps the downloaded installers.
      iis_host_webdeploy_url:
        type: str
        required: true
        description: URL of the Web Deploy MSI on the internal artifact server.
      iis_host_webdeploy_sha256:
        type: str
        required: true
        description: SHA-256 of that MSI.
      iis_host_aspnetcore_version:
        type: str
        required: true
        description: Version of the ASP.NET Core Hosting Bundle, for example 10.0.0.
      iis_host_hosting_bundle_url:
        type: str
        required: true
        description: URL of the Hosting Bundle installer for that version.
      iis_host_hosting_bundle_sha256:
        type: str
        required: true
        description: SHA-256 of that installer.
      iis_host_hosting_bundle_product_id:
        type: str
        required: true
        description: Uninstall registry key for this exact Hosting Bundle, not the standalone runtime.
      iis_host_wmsvc_firewall_rule:
        type: str
        description: Display name of the built-in Web Management Service firewall rule on this image.
      iis_host_deploy_from:
        type: list
        elements: str
        required: true
        description: Addresses or subnets allowed to reach Web Deploy on port 8172.
      iis_host_sites_root:
        type: str
        description: Folder that holds one folder per site.
      iis_host_sites:
        type: list
        elements: dict
        description: Sites to create, each with its own application pool of the same name.
        options:
          name:
            type: str
            required: true
          port:
            type: int
            required: true
          hostname:
            type: str
            description: Host name the binding answers to. Empty answers to any name.
