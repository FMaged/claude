---
- name: Verify the existing Web Management Service firewall rule
  ansible.windows.win_powershell:
    error_action: stop
    parameters:
      RuleName: "{{ iis_host_wmsvc_firewall_rule }}"
    script: |
      param(
          [Parameter(Mandatory)]
          [ValidateNotNullOrEmpty()]
          [string] $RuleName
      )
      Set-StrictMode -Version Latest
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $policy = New-Object -ComObject HNetCfg.FwPolicy2
      $rules = @($policy.Rules | Where-Object { $_.Name -eq $RuleName })
      if ($rules.Count -ne 1) {
          throw "Expected exactly one existing WMSvc firewall rule named '$RuleName'; found $($rules.Count). Check the image's rule display name."
      }
      $rule = $rules[0]
      # INetFwRule uses 1 for inbound/allow and 6 for TCP.
      if ($rule.Direction -ne 1 -or $rule.Action -ne 1 -or $rule.Protocol -ne 6 -or $rule.LocalPorts -ne '8172') {
          throw "The rule '$RuleName' is not an inbound TCP 8172 allow rule. Refusing to modify it."
      }
  check_mode: false

# A separate allow rule would leave the feature's broader built-in rule enabled.
- name: Restrict the Web Management Service to the CI runners
  community.windows.win_firewall_rule:
    name: "{{ iis_host_wmsvc_firewall_rule }}"
    direction: in
    action: allow
    protocol: tcp
    localport: "8172"
    remoteip: "{{ iis_host_deploy_from | join(',') }}"
    profiles: domain
    enabled: true
    state: present

- name: Let the Web Management Service accept remote deploys
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\WebManagement\Server
    name: EnableRemoteManagement
    data: 1
    type: dword
  notify: Restart the Web Management Service

- name: Start the Web Management Service now and at boot
  ansible.windows.win_service:
    name: WMSVC
    start_mode: auto
    state: started

# Web Deploy also installs its own agent service, on port 80. Deploys go through
# the Web Management Service only.
- name: Stop and disable the Web Deployment Agent Service
  ansible.windows.win_service:
    name: MsDepSvc
    start_mode: disabled
    state: stopped
