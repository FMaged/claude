name: check
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y shellcheck
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - uses: hashicorp/setup-packer@v3
        with:
          version: 1.16.2
      - name: Install PSScriptAnalyzer and Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -SkipPublisherCheck
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Ansible, its collections, yamllint, and check-jsonschema
        run: |
          ansible_venv="$RUNNER_TEMP/ansible-venv"
          python3 -m venv "$ansible_venv"
          "$ansible_venv/bin/python" -m pip install ansible-core==2.19.11 ansible-lint==25.6.1 \
            yamllint==1.38.0 check-jsonschema==0.39.0
          export PATH="$ansible_venv/bin:$PATH"
          printf '%s\n' "$ansible_venv/bin" >> "$GITHUB_PATH"
          ansible-galaxy collection install -r evals/examples/ansible/requirements.yml
      - run: evals/lint.sh
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: evals/test-install.sh
